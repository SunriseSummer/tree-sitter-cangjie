name: Release

# onepass and release build and test the complete Node, Python, and WASM
# distribution set before creating a complete GitHub Release. onepass then
# publishes both registries. publish operations consume exact artifacts from
# an existing GitHub Release without rebuilding them. The workflow never edits
# or pushes source files.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a release or publish an existing GitHub Release
        required: true
        type: choice
        options:
          - onepass
          - release
          - publish
          - publish_npm
          - publish_pypi
        default: onepass
      release_version:
        description: Release version for this operation (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      node_version: ${{ steps.versions.outputs.node }}
      python_artifact_version: ${{ steps.versions.outputs.python_artifact }}
      release_version: ${{ steps.versions.outputs.release }}
    steps:
      - if: ${{ inputs.operation == 'onepass' || inputs.operation == 'release' }}
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate operation and resolve versions
        id: versions
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = "onepass" ] || [ "$OPERATION" = "release" ]; then
            if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" != "cangjie-1.0.5" ]; then
              echo "::error::Run onepass and release from the cangjie-1.0.5 branch"
              exit 1
            fi
            node scripts/validate-release.mjs
            git diff --exit-code
          fi

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const operation = process.env.OPERATION;
          const validOperations = new Set([
            "onepass",
            "release",
            "publish",
            "publish_npm",
            "publish_pypi",
          ]);
          if (!validOperations.has(operation)) {
            throw new Error(`unsupported release operation: ${operation}`);
          }
          const buildsRelease = operation === "onepass" || operation === "release";
          const version = process.env.REQUESTED_RELEASE_VERSION?.trim();

          if (!version) {
            throw new Error("release_version is required for every operation");
          }

          if (
            !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/.test(
              version
            )
          ) {
            throw new Error(
              `release version must be npm SemVer without a v prefix: ${version}`
            );
          }

          if (buildsRelease) {
            const nodeVersion =
              require("./bindings/node/package.json").version;
            const pyproject = fs.readFileSync(
              "bindings/python/pyproject.toml",
              "utf8"
            );
            const pythonVersion = pyproject.match(
              /^\s*version\s*=\s*"([^"]+)"\s*$/m
            )?.[1];
            if (!pythonVersion) {
              throw new Error("Unable to resolve the Python package version");
            }
            if (nodeVersion !== pythonVersion) {
              throw new Error(
                `Node and Python source versions must match: ` +
                `${nodeVersion} != ${pythonVersion}`
              );
            }
            if (version !== nodeVersion) {
              throw new Error(
                `release_version must match committed package versions: ` +
                `${version} != ${nodeVersion}`
              );
            }
          }

          const pythonArtifactVersion = version.replace(
            /[-_.]post[-_.]?(\d+)$/i,
            (_, number) => `.post${Number(number)}`
          );
          process.stdout.write(
            `node=${version}\n` +
            `python_artifact=${pythonArtifactVersion}\n` +
            `release=${version}\n`
          );
          NODE

  node-prebuilds:
    needs: preflight
    if: >-
      ${{
        needs.preflight.result == 'success' &&
        (inputs.operation == 'onepass' || inputs.operation == 'release')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: win32-x64
          - runner: windows-11-arm
            target: win32-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bindings/node/package-lock.json
      - run: npm ci
      - run: npm ci --prefix bindings/node
      - name: Stage and test Node prebuild
        run: |
          npm --prefix bindings/node run stage:prebuild -- ${{ matrix.target }}
          npm run test:node
      - uses: actions/upload-artifact@v7
        with:
          name: node-prebuild-${{ matrix.target }}
          path: bindings/node/prebuilds/
          if-no-files-found: error

  python-wheels:
    needs: preflight
    if: >-
      ${{
        needs.preflight.result == 'success' &&
        (inputs.operation == 'onepass' || inputs.operation == 'release')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            arch: aarch64
          - runner: windows-latest
            target: win32-x64
            arch: AMD64
          - runner: windows-11-arm
            target: win32-arm64
            arch: ARM64
          - runner: macos-15-intel
            target: darwin-x64
            arch: x86_64
          - runner: macos-15
            target: darwin-arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and test Python wheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          package-dir: bindings/python
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.target }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  python-sdist:
    needs: preflight
    if: >-
      ${{
        needs.preflight.result == 'success' &&
        (inputs.operation == 'onepass' || inputs.operation == 'release')
      }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build and test source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist bindings/python
          python -m venv "$RUNNER_TEMP/sdist-test"
          "$RUNNER_TEMP/sdist-test/bin/python" -m pip install \
            pytest "tree-sitter~=0.25" dist/tree_sitter_cangjie-*.tar.gz
          "$RUNNER_TEMP/sdist-test/bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests/python"
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wasm:
    needs: preflight
    if: >-
      ${{
        needs.preflight.result == 'success' &&
        (inputs.operation == 'onepass' || inputs.operation == 'release')
      }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            parser/package-lock.json
      - run: npm ci
      - run: npm ci --prefix parser
      - name: Verify generated parser is committed
        run: |
          npm run generate
          git diff --exit-code
      - name: Test parser corpus
        run: npm run test:parser
      - name: Build and test WASM
        run: |
          npm run build:wasm
          npm run test:wasm
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: parser/tree-sitter-cangjie.wasm
          if-no-files-found: error

  release:
    if: >-
      ${{
        always() &&
        needs.preflight.result == 'success' &&
        (inputs.operation == 'onepass' || inputs.operation == 'release') &&
        needs.node-prebuilds.result == 'success' &&
        needs.python-wheels.result == 'success' &&
        needs.python-sdist.result == 'success' &&
        needs.wasm.result == 'success'
      }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    needs:
      - preflight
      - node-prebuilds
      - python-wheels
      - python-sdist
      - wasm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11
      - name: Download Node prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: node-prebuild-*
          path: bindings/node/prebuilds
          merge-multiple: true
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: release
          merge-multiple: true
      - name: Verify Python release artifacts
        run: |
          set -euo pipefail
          V="${{ needs.preflight.outputs.python_artifact_version }}"
          PREFIX="tree_sitter_cangjie-$V"
          test "$(find release -maxdepth 1 -type f -name "$PREFIX-*.whl" | wc -l)" -eq 8
          test "$(find release -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 8
          test -f "release/$PREFIX.tar.gz"
          test "$(find release -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
      - name: Download WASM
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: release
      - name: Assemble and test the npm package
        run: |
          set -euo pipefail
          V="${{ needs.preflight.outputs.node_version }}"
          cp release/tree-sitter-cangjie.wasm parser/
          node bindings/node/scripts/stage-parser.mjs --require-wasm

          cd bindings/node
          npm pack --dry-run --ignore-scripts --json > ../../release/npm-pack.json
          node ../../scripts/validate-npm-pack.mjs ../../release/npm-pack.json
          npm pack --ignore-scripts --pack-destination ../../release
          cd ../..
          node bindings/node/scripts/stage-parser.mjs --clean

          CONSUMER="$RUNNER_TEMP/tree-sitter-cangjie-consumer"
          mkdir -p "$CONSUMER"
          cd "$CONSUMER"
          npm init --yes >/dev/null
          npm install \
            "$GITHUB_WORKSPACE/release/tree-sitter-cangjie-$V.tgz" \
            "tree-sitter@^0.25.0"
          node <<'NODE'
          const Parser = require("tree-sitter");
          const Cangjie = require("tree-sitter-cangjie");
          const parser = new Parser();
          parser.setLanguage(Cangjie);
          const tree = parser.parse("package release_test\nmain() {}\n");
          if (tree.rootNode.hasError) throw new Error(tree.rootNode.toString());
          console.log(tree.rootNode.toString());
          NODE
      - name: Generate checksums
        run: |
          cd release
          sha256sum \
            tree-sitter-cangjie-*.tgz \
            tree-sitter-cangjie.wasm \
            tree_sitter_cangjie-*.whl \
            tree_sitter_cangjie-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            release/tree-sitter-cangjie-*.tgz
            release/tree-sitter-cangjie.wasm
            release/tree_sitter_cangjie-*.whl
            release/tree_sitter_cangjie-*.tar.gz
            release/SHA256SUMS
      - name: Prepare release notes and validate tag
        run: |
          V="${{ needs.preflight.outputs.release_version }}"
          TAG="v$V"
          node scripts/extract-release-notes.mjs "$V" > release-notes.md
          if git rev-parse --verify "$TAG^{commit}" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG^{commit}")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already points to $TAG_SHA, not $GITHUB_SHA"
              exit 1
            fi
          fi
      - name: Create or refresh complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.preflight.outputs.release_version }}"
          TAG="v$V"
          assets=(
            release/tree-sitter-cangjie-*.tgz
            release/tree-sitter-cangjie.wasm
            release/tree_sitter_cangjie-*.whl
            release/tree_sitter_cangjie-*.tar.gz
            release/SHA256SUMS
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi

  npm-publish:
    name: Publish Node package to npm
    needs:
      - preflight
      - release
    if: >-
      ${{
        always() &&
        needs.preflight.result == 'success' &&
        ((needs.release.result == 'success' && inputs.operation == 'onepass') ||
          inputs.operation == 'publish' ||
          inputs.operation == 'publish_npm')
      }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11
      - name: Download and verify npm package from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "tree-sitter-cangjie-$RELEASE_VERSION.tgz" \
            --pattern "SHA256SUMS" \
            --dir release
          cd release
          test -f "tree-sitter-cangjie-$RELEASE_VERSION.tgz"
          grep -F "  tree-sitter-cangjie-$RELEASE_VERSION.tgz" SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
      - name: Publish exact Node tarball to npm
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          set -euo pipefail
          PACKAGE="tree-sitter-cangjie"
          if npm view "$PACKAGE@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "skip $PACKAGE@$RELEASE_VERSION (already published)"
            exit 0
          fi

          echo "npm auth: OIDC trusted publishing"
          TARBALL="$GITHUB_WORKSPACE/release/tree-sitter-cangjie-$RELEASE_VERSION.tgz"
          npm publish "$TARBALL" \
            --access public \
            --tag latest \
            --provenance
      - name: Verify npm registry
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm view "tree-sitter-cangjie@$RELEASE_VERSION" version >/dev/null 2>&1; then
              echo "verified tree-sitter-cangjie@$RELEASE_VERSION"
              exit 0
            fi
            echo "waiting for npm registry propagation ($attempt)"
            sleep 10
          done
          echo "::error::tree-sitter-cangjie@$RELEASE_VERSION did not appear on npm"
          exit 1

  pypi-publish:
    name: Publish Python distributions to PyPI
    needs:
      - preflight
      - release
    if: >-
      ${{
        always() &&
        needs.preflight.result == 'success' &&
        ((needs.release.result == 'success' && inputs.operation == 'onepass') ||
          inputs.operation == 'publish' ||
          inputs.operation == 'publish_pypi')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify Python distributions from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
          PYTHON_VERSION: ${{ needs.preflight.outputs.python_artifact_version }}
        run: |
          set -euo pipefail
          mkdir -p release dist
          gh release download "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "tree_sitter_cangjie-$PYTHON_VERSION-*.whl" \
            --pattern "tree_sitter_cangjie-$PYTHON_VERSION.tar.gz" \
            --pattern "SHA256SUMS" \
            --dir release

          PREFIX="tree_sitter_cangjie-$PYTHON_VERSION"
          test "$(find release -maxdepth 1 -type f -name "$PREFIX-*.whl" | wc -l)" -eq 8
          test -f "release/$PREFIX.tar.gz"
          grep -F "  $PREFIX" release/SHA256SUMS
          (
            cd release
            sha256sum --check --ignore-missing SHA256SUMS
          )
          cp release/"$PREFIX"-*.whl release/"$PREFIX".tar.gz dist/
      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
      - name: Verify PyPI registry
        env:
          PYTHON_VERSION: ${{ needs.preflight.outputs.python_artifact_version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error \
              "https://pypi.org/pypi/tree-sitter-cangjie/$PYTHON_VERSION/json" \
              >/dev/null; then
              echo "verified tree-sitter-cangjie==$PYTHON_VERSION"
              exit 0
            fi
            echo "waiting for PyPI propagation ($attempt)"
            sleep 10
          done
          echo "::error::tree-sitter-cangjie==$PYTHON_VERSION did not appear on PyPI"
          exit 1
