[package]
name = "tree-sitter-cangjie"
description = "Cangjie parser for tree-sitter"
version = "1.0.5"
authors = ["vchuoshen6 <vchuoshen6@163.com>"]
license = "MulanPSL-2.0"
readme = "../../README.md"
keywords = ["incremental", "parsing", "tree-sitter", "cangjie"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://gitcode.com/Cangjie-SIG/tree-sitter-cangjie"
edition = "2021"
autoexamples = false

build = "build.rs"
include = [
  "build.rs",
  "lib.rs",
  "../../grammar/*",
  "../../queries/*",
  "../../src/*",
  "../../tree-sitter.json",
  "../../LICENSE",
]

[lib]
path = "lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.3"
