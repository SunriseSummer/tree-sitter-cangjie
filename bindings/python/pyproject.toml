[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-cangjie"
description = "Cangjie grammar for tree-sitter"
version = "1.0.5"
keywords = ["incremental", "parsing", "tree-sitter", "cangjie"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "vchuoshen6", email = "vchuoshen6@163.com" }]
requires-python = ">=3.10"
license = "MulanPSL-2.0"

[project.urls]
Homepage = "https://gitcode.com/Cangjie-SIG/tree-sitter-cangjie"

[project.optional-dependencies]
core = ["tree-sitter~=0.25"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
